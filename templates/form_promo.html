<!DOCTYPE html>
<html>
<head>
  <title>SHINE MASTER SOLUTION - DISPO FORM</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .header {
      text-align: center;
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
    }

    h2, h3 {
      margin: 5px 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #000;
      padding: 4px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
    }

    .remarks {
      margin-top: 20px;
    }

    .box {
      border: 1px solid #000;
      height: 60px;
      margin-top: 5px;
    }

    button {
      margin-bottom: 15px;
    }

    @media print {
      button {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="header">
  <!-- LOGO HERE -->
  
  <img src="{{ url_for('static', filename='images/favicon.png') }}" class="logo" alt="Company Logo">

  <h2>SHINE MASTER SOLUTION</h2>
  <h3>DISPO PROMOTION PACKAGE – 100 CARS RECORD FORM</h3>
</div>

<button onclick="window.print()">PRINT FORM</button>

<table>
  <tr>
    <th>No</th>
    <th>Car Plate Number</th>
    <th>Date In</th>
    <th>Time In</th>
    <th>Date Out</th>
    <th>Time Out</th>
    <th>✓</th>
  </tr>

  <script>
    for (let i = 1; i <= 100; i++) {
      document.write(`
        <tr>
          <td>${i}</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td>☐</td>
        </tr>
      `);
    }
  </script>
</table>

<div class="remarks">
  <h4>Remarks</h4>
  <div class="box"></div>
  <div class="box"></div>
</div>

</body>
</html>
