<!DOCTYPE html>
<html>
<head>
<title>Sales Report</title>

<style>
body{
font-family:Arial;
background:#0f0f0f;
color:white;
margin:0;
}

.header{
background:#ba55d3;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.section{
background:#1c1c1c;
padding:20px;
border-radius:10px;
}

input, button{
padding:10px;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th, td{
padding:10px;
border-bottom:1px solid #333;
}

th{
background:#2a2a2a;
}

button{
background:#ba55d3;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

/* PRINT MODE */
@media print {
body{
background:white;
color:black;
}

.header, button, input{
display:none;
}

.section{
background:white;
}

table{
color:black;
}

th{
background:#ddd;
}
}
</style>

</head>

<body>

<div class="header">
<h2>Sales Report</h2>
<a href="/"><button>Back</button></a>
</div>

<div class="container">

<div class="section">

<!-- 🔥 COMPANY HEADER -->
<div style="text-align:center; margin-bottom:20px; border-bottom:1px solid #444; padding-bottom:15px;">

<h2>SHINE MASTER SOLUTION</h2>

<p>
68, Jalan Putra 1,<br>
Taman Tan Sri Yaacob,<br>
81300 Skudai, Johor
</p>

<p style="font-size:13px; color:#aaa;">
Reg. No: SA0650100-H | Contact: 018-2096907
</p>

<h3>SALES REPORT</h3>

<p style="font-size:12px; color:#aaa;">
Generated on: <span id="reportDate"></span>
</p>

</div>

<!-- FILTER -->
<h3>Filter Date</h3>

<input type="date" id="fromDate">
<input type="date" id="toDate">

<button onclick="loadReport()">Search</button>
<button onclick="window.print()">Print</button>

<!-- TABLE -->
<table>
<thead>
<tr>
<th>Invoice</th>
<th>Car Plate</th>
<th>Service</th>
<th>Price</th>
<th>Net</th>
<th>Paid</th>
<th>Date</th>
</tr>
</thead>

<tbody id="reportBody">
<tr><td colspan="7" style="text-align:center;">Select date range</td></tr>
</tbody>

</table>

</div>

</div>

<script>
function loadReport(){

    let from = document.getElementById("fromDate").value;
    let to = document.getElementById("toDate").value;

    let url = "/sales_report";

    if (from && to) {
        url = `/sales_report?from=${from}&to=${to}`;
    }

    fetch(url)
    .then(res => res.json())
    .then(data => {

        let rows = "";
        let total = 0;

        if(data.length === 0){
            rows = "<tr><td colspan='7'>No data found</td></tr>";
        }

        data.forEach(s => {

            total += s.paid;

            rows += `
            <tr>
                <td>${s.invoice}</td>
                <td>${s.car_plate}</td>
                <td>${s.service_type}</td>
                <td>RM ${s.price}</td>
                <td>RM ${s.net.toFixed(2)}</td>
                <td>RM ${s.paid.toFixed(2)}</td>
                <td>${s.date}</td>
            </tr>
            `;
        });

        if(data.length > 0){
            rows += `
            <tr style="font-weight:bold;">
                <td colspan="5" style="text-align:right;">TOTAL</td>
                <td colspan="2">RM ${total.toFixed(2)}</td>
            </tr>
            `;
        }

        document.getElementById("reportBody").innerHTML = rows;

    })
    .catch(err => {
        console.error("FETCH ERROR:", err);
    });
}

// AUTO LOAD
document.addEventListener("DOMContentLoaded", function () {
    loadReport();
    document.getElementById("reportDate").innerText = new Date().toLocaleString();
});
</script>

</body>
</html>
