<!DOCTYPE html>
<html>
<head>
<title>Sales Report</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial;
background:#0f0f0f;
color:white;
margin:0;
}

.header{
background:#ba55d3;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
padding:20px;
}

.section{
background:#1c1c1c;
padding:20px;
border-radius:10px;
}

input, button{
padding:10px;
margin:5px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th, td{
padding:10px;
border-bottom:1px solid #333;
}

th{
background:#2a2a2a;
}

button{
background:#ba55d3;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

canvas{
background:#111;
border-radius:10px;
padding:10px;
margin-bottom:20px;
}

/* PRINT MODE */
@media print {
body{
background:white;
color:black;
}

.header,
button,
input,
canvas{
display:none;
}

.section{
background:white;
}

th{
background:#ddd;
}
}
</style>

</head>

<body>

<div class="header">
<h2>Sales Report</h2>
<a href="/"><button>Back</button></a>
</div>

<div class="container">

<div class="section">

<!-- COMPANY HEADER -->
<div style="text-align:center; margin-bottom:20px; border-bottom:1px solid #444; padding-bottom:15px;">

<h2>SHINE MASTER SOLUTION</h2>

<p>
68, Jalan Putra 1,<br>
Taman Tan Sri Yaacob,<br>
81300 Skudai, Johor
</p>

<p style="font-size:13px; color:#aaa;">
Reg. No: SA0650100-H | Contact: 018-2096907
</p>

<h3>SALES REPORT</h3>

<p style="font-size:12px; color:#aaa;">
Generated on:
<span id="reportDate"></span>
</p>

</div>

<!-- FILTER -->
<h3>Filter Date</h3>

<input type="date" id="fromDate">
<input type="date" id="toDate">

<button onclick="loadReport()">Search</button>
<button onclick="window.print()">Print</button>

<!-- CHART -->
<canvas id="netChart" height="120"></canvas>

<!-- TABLE -->
<table>

<thead>
<tr>
<th>Invoice</th>
<th>Car Plate</th>
<th>Service</th>
<th>Price</th>
<th>Net</th>
<th>Paid</th>
<th>Date</th>
</tr>
</thead>

<tbody id="reportBody">
<tr>
<td colspan="7" style="text-align:center;">
Loading...
</td>
</tr>
</tbody>

</table>

</div>

</div>

<script>

let chart;

// LOAD REPORT
function loadReport(){

    let from = document.getElementById("fromDate").value;
    let to = document.getElementById("toDate").value;

    let url = "/sales_report";

    if(from && to){
        url = `/sales_report?from=${from}&to=${to}`;
    }

    fetch(url)
    .then(res => res.json())
    .then(data => {

        let rows = "";
        let totalNet = 0;

        // JAN - DEC structure
        let monthlyData = {
            "Jan": 0,
            "Feb": 0,
            "Mar": 0,
            "Apr": 0,
            "May": 0,
            "Jun": 0,
            "Jul": 0,
            "Aug": 0,
            "Sep": 0,
            "Oct": 0,
            "Nov": 0,
            "Dec": 0
        };

        if(data.length === 0){
            rows = `
            <tr>
                <td colspan="7" style="text-align:center;">
                    No data found
                </td>
            </tr>
            `;
        }

        data.forEach(s => {

            let price = Number(s.price || 0);
            let net = Number(s.net || 0);
            let paid = Number(s.paid || 0);

            totalNet += net;

            // MONTHLY GROUPING
            let rawDate = s.date || "";

            let monthNumber = rawDate.slice(5,7);

            let monthMap = {
                "01":"Jan",
                "02":"Feb",
                "03":"Mar",
                "04":"Apr",
                "05":"May",
                "06":"Jun",
                "07":"Jul",
                "08":"Aug",
                "09":"Sep",
                "10":"Oct",
                "11":"Nov",
                "12":"Dec"
            };

            let monthName = monthMap[monthNumber];

            if(monthName){
                monthlyData[monthName] += net;
            }

            rows += `
            <tr>
                <td>${s.invoice}</td>
                <td>${s.car_plate}</td>
                <td>${s.service_type}</td>
                <td>RM ${price.toFixed(2)}</td>
                <td>RM ${net.toFixed(2)}</td>
                <td>RM ${paid.toFixed(2)}</td>
                <td>${s.date}</td>
            </tr>
            `;
        });

        // TOTAL NETT ROW
        if(data.length > 0){

            rows += `
            <tr style="font-weight:bold; background:#2a2a2a;">
                <td colspan="4" style="text-align:right;">
                    TOTAL NETT
                </td>

                <td>
                    RM ${totalNet.toFixed(2)}
                </td>

                <td colspan="2"></td>
            </tr>
            `;
        }

        document.getElementById("reportBody").innerHTML = rows;

        updateChart(monthlyData);

    })
    .catch(err => {
        console.error("FETCH ERROR:", err);
    });

}

// UPDATE CHART
function updateChart(monthlyData){

    let labels = Object.keys(monthlyData);
    let values = Object.values(monthlyData);

    if(chart){
        chart.destroy();
    }

    chart = new Chart(document.getElementById("netChart"), {

        type: 'bar',

        data: {
            labels: labels,

            datasets: [{
                label: 'Monthly Net Revenue (RM)',
                data: values,
                backgroundColor: '#ba55d3'
            }]
        },

        options: {

            responsive: true,

            plugins: {
                legend: {
                    labels: {
                        color: 'white'
                    }
                }
            },

            scales: {

                x: {
                    ticks: {
                        color: 'white'
                    }
                },

                y: {
                    beginAtZero: true,
                    ticks: {
                        color: 'white'
                    }
                }
            }
        }
    });
}

// AUTO LOAD
document.addEventListener("DOMContentLoaded", function () {

    loadReport();

    document.getElementById("reportDate").innerText =
        new Date().toLocaleString();

});

</script>

</body>
</html>
