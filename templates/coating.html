<!DOCTYPE html>
<html>
<head>
<title>Shine Master Packages</title>

<style>
body {
    background:#0f0f0f;
    font-family:Arial;
    color:white;
    margin:0;
    text-align:center;
}

/* HEADER */
.header {
    padding:30px;
}
.header h1 { color:#ffd500; }
.header h2 { color:#9b5cff; }

/* SLIDER */
.slider {
    position: relative;
    max-width: 500px;
    margin: 20px auto;
}

/* IMAGES */
.slide {
    width: 100%;
    border-radius: 12px;
    display: none;
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
}

.slide.active {
    display: block;
}

/* BUTTONS */
.prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    padding: 12px;
    cursor: pointer;
    border-radius: 50%;
    font-size: 18px;
}

.prev { left: 10px; }
.next { right: 10px; }

.prev:hover, .next:hover {
    background: #9b5cff;
}

/* MOBILE */
@media (max-width:600px){
    .slider { max-width: 90%; }
}
</style>
</head>

<body>

<div class="header">
    <h1>SHINE MASTER SOLUTION</h1>
    <h2>Auto Detailing Packages</h2>
    <p>Coating - Polish - Waxing</p>
</div>

<!-- SLIDER -->
<div class="slider">

    <img src="/static/allphotos/condcoat.png" class="slide active">
    <img src="/static/allphotos/dispoc.png" class="slide">
    <img src="/static/allphotos/dispoe.png" class="slide">
    <img src="/static/allphotos/graph123.png" class="slide">
    <img src="/static/allphotos/graphene.png" class="slide">
    <img src="/static/allphotos/maint.png" class="slide">
    <img src="/static/allphotos/notes.png" class="slide">
    <img src="/static/allphotos/polishw.png" class="slide">

    <button class="prev">&#10094;</button>
    <button class="next">&#10095;</button>

</div>

<script>
let slides = document.querySelectorAll('.slide');
let index = 0;

function showSlide(i) {
    slides.forEach(slide => slide.classList.remove('active'));
    slides[i].classList.add('active');
}

document.querySelector('.next').onclick = () => {
    index = (index + 1) % slides.length;
    showSlide(index);
};

document.querySelector('.prev').onclick = () => {
    index = (index - 1 + slides.length) % slides.length;
    showSlide(index);
};
</script>

</body>
</html>
