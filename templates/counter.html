<!DOCTYPE html>
<html>
<head>
<title>Counter Cash Register</title>

<style>
body{
    font-family: monospace;
    width:180px;
    margin:auto;
    font-size:14px;
}

.center{text-align:center;}
.line{width:100%;}
.left{float:left;}
.right{float:right;}
.clear{clear:both;}

hr{
    border-top:1px dashed black;
}

@media print{
    body{width:180px;}
}
</style>
</head>

<body>

<p class="center"><strong>CASH REGISTER</strong></p>

<div class="center">
SHINE MASTER SOLUTION<br>
COUNTER RECORD
</div>

<hr>

<div class="line">
<span class="left">Date</span>
<span class="right">2026-05-03</span>
<div class="clear"></div>
</div>

<div class="line">
<span class="left">Time</span>
<span class="right">19:45:00</span>
<div class="clear"></div>
</div>

<hr>

<div class="line">
<span class="left">Counter</span>
<span class="right">MAIN</span>
<div class="clear"></div>
</div>

<div class="line">
<span class="left">Handled By</span>
<span class="right">STAFF</span>
<div class="clear"></div>
</div>

<hr>

<div class="line">
<span class="left"><strong>CASH SPLIT</strong></span>
<span class="right"><strong>RM 42.00</strong></span>
<div class="clear"></div>
</div>

<hr>

<p class="center">
COUNTER FLOAT / REGISTER<br>
FOR DAILY CASH RECORD
</p>

<hr>

<p class="center">
Signature: _______________<br><br>
Thank You
</p>

</body>
</html>
