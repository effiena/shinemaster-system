<!DOCTYPE html>
<html>
<head>

<style>
body { background:#0f0f0f; font-family:Arial; color:white; margin:0; }
.header { text-align:center; padding:30px; }

.header h2 { color:#9b5cff; }
.container { display:flex; flex-wrap:wrap; justify-content:center; gap:25px; padding:20px; }

.card-link {

.card {

  border-top:4px solid #ffd500;

.card:hover {
  transform: translateY(-4px);
  cursor:pointer;

.card h3 { color:#ffd500; }
.price { color:#9b5cff; font-size:18px; margin-bottom:10px; }
ul { padding-left:18px; }
li { margin-bottom:6px; font-size:14px; }

</head>

</div>

</div>

</ul>

</div>

<div class="card">

</div>

</html>
