<!DOCTYPE html>
<html>
<head>
<title>Shine Master Packages</title>

<style>
body {
    background: #0f0f0f;
    font-family: Arial, sans-serif;
    color: white;
    margin: 0;
    position: relative;
    z-index: 1;
}

/* HEADER IMAGE */
.header-img {
    text-align: center;
    margin-top: 25px;
    position: relative;
    z-index: 2; /* above rain */
}

.header-img img {
    width: 500px;
    max-width: 60%;
    height: auto;
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 0 10px rgba(155,92,255,0.5));
}

/* SECTION TITLE */
.section h2 {
    text-align: center;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* CARD CONTAINER */
.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
    padding: 20px;
    position: relative;
    z-index: 2;
}

/* CARD DESIGN */
.card {
    background: #1a1a1a;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    border-top: 4px solid #ffd500;
    transition: all 0.25s ease;
    width: 320px;
}

.card:hover {
    transform: translateY(-6px) scale(1.02);
    cursor: pointer;
    box-shadow: 0 12px 30px rgba(155,92,255,0.4);
}

.card h3 {
    color: #ffd500;
    margin-bottom: 10px;
}

.price {
    color: #9b5cff;
    font-size: 18px;
    margin-bottom: 10px;
    font-weight: bold;
}

ul {
    padding-left: 18px;
}

li {
    margin-bottom: 6px;
    font-size: 14px;
}

/* 🌧️ RAIN EFFECT */
.rain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.drop {
    position: absolute;
    bottom: 100%;
    width: 2px;
    height: 20px;
    background: linear-gradient(transparent, #9b5cff);
    animation: rain 1s linear infinite;
    opacity: 0.6;
    box-shadow: 0 0 6px #9b5cff;
}

@keyframes rain {
    to {
        transform: translateY(100vh);
    }
}
</style>
</head>

<body>

<!-- RAIN -->
<div class="rain" id="rain"></div>

<!-- IMAGE ABOVE TITLE -->
<div class="header-img">
    <img src="/static/wash.png" alt="Wash Image">
</div>

<div class="section">

<h2>Membership Packages</h2>

<div class="container">

<div class="card">
<h3>1 Year Wash Package</h3>
<div class="price">Buy 24 Free 1 Maintenance Wash</div>
<ul>
<li>Sedan RM480</li>
<li>SUV / MPV RM576</li>
<li>Large MPV / 4x4 RM672</li>
</ul>
</div>

<div class="card">
<h3>2 Years Wash Package</h3>
<div class="price">Buy 48 Free 1 Polishing & Waxing</div>
<ul>
<li>Sedan RM960</li>
<li>SUV / MPV RM1152</li>
<li>Large MPV / 4x4 RM1344</li>
</ul>
</div>

</div>
</div>

<script>
const rainContainer = document.getElementById('rain');

for (let i = 0; i < 120; i++) {
    let drop = document.createElement('div');
    drop.classList.add('drop');

    drop.style.left = Math.random() * 100 + 'vw';
    drop.style.animationDuration = (0.5 + Math.random()) + 's';
    drop.style.opacity = Math.random();

    rainContainer.appendChild(drop);
}
</script>

</body>
</html>
